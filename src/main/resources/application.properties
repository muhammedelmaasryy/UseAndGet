spring.application.name=UseAndGet
server.port=8090

spring.datasource.url=jdbc:postgresql://localhost:5432/UseAndGet
spring.datasource.username=UseAndGet-admin
spring.datasource.password=UseAndGet
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update                                       
spring.jpa.show-sql=true